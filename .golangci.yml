version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - (*encoding/csv.Writer).Write
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
        - (*github.com/spf13/pflag.PFlagSet).GetString
        - (*os.File).WriteString
        - github.com/spf13/viper.BindEnv
        - github.com/spf13/viper.BindPFlags
        - github.com/spf13/viper.ReadConfig
        - github.com/spf13/viper.ReadInConfig
        - github.com/spf13/viper.Unmarshal
    staticcheck:
      checks:
        - all
        - -SA5001
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
